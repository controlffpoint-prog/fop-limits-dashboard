<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOP Limits Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const ANNUAL_LIMIT = 6672000;

    const initialFops = [
      { id: 1, name: "ФОП ЛІТВІНОВА ЛІЛІЯ ВІКТОРІВНА", inn: "2848013968", banks: "ПУМБ, УКРГАЗ, НОВАПЕЙ", turnover: 3564302, status: "active" },
      { id: 2, name: "ФОП Гоц Георгій Олександрович", inn: "3665109659", banks: "НОВАПЕЙ, ПРИВАТ", turnover: 5930814, status: "pause", statusDate: "01.07" },
      { id: 3, name: "ФОП Постольний Євгеній Віталійович", inn: "3565711577", banks: "НОВАПЕЙ, УКРСІБ", turnover: 6105651, status: "active" },
      { id: 4, name: "ФОП Левченко Анастасія Миколаївна", inn: "3506907965", banks: "НОВАПЕЙ, МОНО", turnover: 4479652, status: "active" },
      { id: 5, name: "ФОП Литвинова Вікторія Вікторівна", inn: "3489120192", banks: "НОВАПЕЙ", turnover: 6418076, status: "pause", statusDate: "15.08" },
      { id: 6, name: "ФОП РУДЕНКО АРТЕМ АНДРІЙОВИЧ", inn: "3391029384", banks: "НОВАПЕЙ", turnover: 6732079, status: "active" },
      { id: 7, name: "ФОП ЛЕВЧЕНКО ЄВГЕНІЙ ОЛЕКСАНДРОВИЧ", inn: "3291039481", banks: "НОВАПЕЙ, МОНО", turnover: 5796898, status: "active" },
      { id: 8, name: "ФОП КЛАДОВ ОЛЕКСІЙ ВІКТОРОВИЧ", inn: "3102938475", banks: "НОВАПЕЙ", turnover: 4980542, status: "active" },
      { id: 9, name: "ФОП МІЩЕНКО ИГОР ВАЛЕРІЙОВИЧ", inn: "3491029381", banks: "НОВАПЕЙ", turnover: 6322823, status: "active" },
      { id: 10, name: "ФОП МИРОНЕНКО АНДРІЙ СЕРГІЙОВИЧ", inn: "3201928374", banks: "НОВАПЕЙ", turnover: 4315638, status: "active" }
    ];

    function App() {
      const [search, setSearch] = React.useState("");
      const [filter, setFilter] = React.useState("all");

      const processed = React.useMemo(() => {
        return initialFops.map(fop => {
          const pct = Math.min(100, Number(((fop.turnover / ANNUAL_LIMIT) * 100).toFixed(1)));
          const remaining = ANNUAL_LIMIT - fop.turnover;
          let cat = "safe", label = "Запас", badge = "bg-emerald-50 text-emerald-700 border-emerald-200", bar = "bg-emerald-500";
          if (pct >= 90) { cat = "critical"; label = "критично"; badge = "bg-red-50 text-red-600 border-red-200"; bar = "bg-red-500"; }
          else if (pct >= 80) { cat = "high"; label = "высокий риск"; badge = "bg-orange-50 text-orange-600 border-orange-200"; bar = "bg-orange-500"; }
          else if (pct >= 70) { cat = "watch"; label = "следить"; badge = "bg-amber-50 text-amber-600 border-amber-200"; bar = "bg-amber-400"; }
          return { ...fop, pct, remaining, cat, label, badge, bar };
        });
      }, []);

      const totalTurnover = processed.reduce((a, b) => a + b.turnover, 0);
      const totalFree = processed.length * ANNUAL_LIMIT - totalTurnover;

      const filtered = processed.filter(f => {
        const m = f.name.toLowerCase().includes(search.toLowerCase()) || f.inn.includes(search);
        return filter === "all" ? m : m && f.cat === filter;
      });

      const fmt = v => v >= 1000000 ? (v / 1000000).toFixed(1).replace(".", ",") + " млн" : new Intl.NumberFormat("ru-RU").format(v) + " ₴";

      return (
        <div class="flex min-h-screen">
          <aside class="w-64 bg-white border-r border-slate-200 p-6 hidden md:block">
            <div class="font-bold text-xl text-slate-900 mb-8 flex items-center gap-2">
              <span class="w-7 h-7 bg-blue-600 text-white rounded flex items-center justify-center text-xs">F</span>
              FOP Limits
            </div>
            <nav class="space-y-2 text-sm font-medium text-slate-600">
              <div class="p-2.5 bg-slate-100 text-blue-600 rounded-lg">Дашборд</div>
              <div class="p-2.5 hover:bg-slate-50 rounded-lg">ФОПы</div>
              <div class="p-2.5 hover:bg-slate-50 rounded-lg">Планировщик</div>
              <div class="p-2.5 hover:bg-slate-50 rounded-lg">Налоги</div>
            </nav>
          </aside>

          <main class="flex-1 p-6 md:p-10 max-w-7xl">
            <div class="flex justify-between items-center mb-8">
              <div>
                <h1 class="text-2xl font-bold text-slate-900">Дашборд</h1>
                <p class="text-xs text-slate-400 mt-1">Доход 2026 • Лимит 2 группы: 6,67 млн ₴</p>
              </div>
              <div class="flex items-center gap-2 text-xs text-slate-500 bg-white px-3 py-1.5 rounded-full border border-slate-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Синхронизировано
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-400">В красной зоне</div>
                <div class="text-3xl font-bold text-red-500 mt-1">{processed.filter(f => f.cat === "critical").length}</div>
              </div>
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-400">Доход сети</div>
                <div class="text-3xl font-bold text-slate-900 mt-1">{fmt(totalTurnover)}</div>
              </div>
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-400">Свободный запас</div>
                <div class="text-3xl font-bold text-slate-900 mt-1">{fmt(totalFree)}</div>
              </div>
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-400">Всего ФОП</div>
                <div class="text-3xl font-bold text-slate-900 mt-1">{processed.length}</div>
              </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
              <div class="flex flex-col md:flex-row justify-between gap-4 mb-6">
                <div class="flex gap-1 bg-slate-100 p-1 rounded-lg text-xs font-medium">
                  {["all", "critical", "high", "watch", "safe"].map(t => (
                    <button key={t} onClick={() => setFilter(t)} class={`px-3 py-1.5 rounded-md ${filter === t ? "bg-white text-slate-900 shadow-sm" : "text-slate-600"}`}>
                      {t === "all" ? "Все" : t === "critical" ? "Критично" : t === "high" ? "Высокий риск" : t === "watch" ? "Следить" : "Запас"}
                    </button>
                  ))}
                </div>
                <input type="text" placeholder="Поиск ФОП или ИНН..." value={search} onChange={e => setSearch(e.target.value)} class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg outline-none w-full md:w-64" />
              </div>

              <div class="space-y-3">
                {filtered.map(f => (
                  <div key={f.id} class="p-4 rounded-xl border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:border-slate-200 transition">
                    <div class="md:w-1/3">
                      <div class="font-semibold text-sm text-slate-900">{f.name}</div>
                      <div class="text-[11px] text-slate-400 mt-0.5">ИНН {f.inn} • {f.banks}</div>
                    </div>
                    <div class="md:w-1/2">
                      <div class="relative w-full h-7 bg-slate-100 rounded-lg overflow-hidden flex items-center px-3 justify-between">
                        <div class={`absolute left-0 top-0 bottom-0 ${f.bar} transition-all duration-500 rounded-lg`} style={{ width: `${f.pct}%` }}></div>
                        <span class="relative z-10 text-[11px] font-medium text-slate-700">остаток {new Intl.NumberFormat("ru-RU").format(f.remaining)} ₴ {f.status === "pause" && `• пауза с ${f.statusDate}`}</span>
                        <span class="relative z-10 text-xs font-bold text-slate-800">{f.pct}%</span>
                      </div>
                    </div>
                    <div>
                      <span class={`text-[11px] font-medium px-2.5 py-1 rounded-md border ${f.badge}`}>{f.label}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
