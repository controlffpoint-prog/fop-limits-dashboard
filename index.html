<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>Контроль лімітів ФОП 2026</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7fb 0%,
                    #eef2f7 100%
                );

            color: #1f2937;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow:
                0 8px 30px rgba(0,0,0,0.07);
        }

        .title {
            font-size: 30px;
            font-weight: 800;
            margin: 0 0 8px;
        }

        .subtitle {
            color: #6b7280;
            margin: 0;
            font-size: 15px;
        }

        .status {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #6b7280;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
        }

        .dot.error {
            background: #ef4444;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow:
                0 8px 30px rgba(0,0,0,0.06);
        }

        .stat-label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
        }

        .search-box {
            background: white;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow:
                0 8px 30px rgba(0,0,0,0.06);
        }

        .search {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
        }

        .list {
            display: grid;
            gap: 15px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow:
                0 8px 30px rgba(0,0,0,0.06);

            border-left: 6px solid #22c55e;
        }

        .card.watch {
            border-left-color: #f59e0b;
        }

        .card.high {
            border-left-color: #f97316;
        }

        .card.critical {
            border-left-color: #ef4444;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .fop-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .details {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .percent {
            font-size: 26px;
            font-weight: 900;
            white-space: nowrap;
        }

        .progress {
            height: 12px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 18px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: #22c55e;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        .progress-bar.watch {
            background: #f59e0b;
        }

        .progress-bar.high {
            background: #f97316;
        }

        .progress-bar.critical {
            background: #ef4444;
        }

        .money-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 14px;
            color: #6b7280;
        }

        .money {
            font-weight: 800;
            color: #111827;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            display: none;
            white-space: pre-wrap;
        }

        .empty {
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            color: #6b7280;
        }

        .loading {
            background: white;
            border-radius: 18px;
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .card-top {
                flex-direction: column;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1 class="title">
            Контроль лімітів ФОП 2026
        </h1>

        <p class="subtitle">
            Моніторинг доходів ФОП у реальному часі
        </p>

        <div class="status">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">
                Завантаження...
            </span>
        </div>

    </div>


    <div id="errorBox" class="error"></div>


    <div class="stats">

        <div class="stat">
            <div class="stat-label">
                Всього ФОП
            </div>

            <div
                id="fopCount"
                class="stat-value"
            >
                —
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                Загальний дохід
            </div>

            <div
                id="totalTurnover"
                class="stat-value"
            >
                —
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                Вільний ліміт
            </div>

            <div
                id="freeLimit"
                class="stat-value"
            >
                —
            </div>
        </div>

    </div>


    <div class="search-box">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Пошук ФОП за назвою або ІНН..."
        >

    </div>


    <div
        id="list"
        class="list"
    >

        <div class="loading">
            Завантаження даних...
        </div>

    </div>

</div>


<script>

    /*
     * ================================
     * НАСТРОЙКИ
     * ================================
     */

    const API_URL =
        "https://script.google.com/macros/s/AKfycbyX4JrbmO2ZdOQbIiWYqDWHPsuLiljkBgEzLRhV-mGLrNCsF4Y-4z23eAGcOwhAAYRL/exec?token=my-secure-fop-token-2026";


    /*
     * Лимит ФОП на 2026 год.
     */

    const ANNUAL_LIMIT = 6672000;


    /*
     * Обновляем данные каждые 5 секунд.
     */

    const REFRESH_INTERVAL = 5000;


    let allFops = [];


    /*
     * Формат денег.
     */

    function formatMoney(value) {

        return new Intl.NumberFormat(
            "uk-UA",
            {
                maximumFractionDigits: 0
            }
        ).format(Number(value) || 0) + " грн";

    }


    /*
     * Процент использования лимита.
     */

    function getPercent(turnover) {

        return (
            (Number(turnover) / ANNUAL_LIMIT) * 100
        );

    }


    /*
     * Категория ФОП.
     */

    function getCategory(percent) {

        if (percent >= 90) {
            return "critical";
        }

        if (percent >= 80) {
            return "high";
        }

        if (percent >= 70) {
            return "watch";
        }

        return "safe";

    }


    /*
     * Загружаем данные из Google Apps Script.
     */

    async function loadData() {

        const errorBox =
            document.getElementById("errorBox");

        const statusText =
            document.getElementById("statusText");

        const statusDot =
            document.getElementById("statusDot");


        try {

            /*
             * Добавляем timestamp,
             * чтобы браузер не использовал старый cache.
             */

            const url =
                API_URL +
                "&_=" +
                Date.now();


            const response =
                await fetch(
                    url,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP ошибка: " +
                    response.status
                );

            }


            const result =
                await response.json();


            console.log(
                "API:",
                result
            );


            if (result.status !== "success") {

                throw new Error(
                    result.error ||
                    "Google Apps Script вернул ошибку"
                );

            }


            if (!Array.isArray(result.data)) {

                throw new Error(
                    "API не вернул массив data"
                );

            }


            /*
             * Сохраняем данные.
             */

            allFops = result.data;


            /*
             * Обновляем интерфейс.
             */

            updateStats();

            renderFops();


            /*
             * Убираем ошибку.
             */

            errorBox.style.display =
                "none";


            statusDot.classList.remove(
                "error"
            );


            const now =
                new Date();


            statusText.textContent =
                "Синхронізовано: " +
                now.toLocaleTimeString(
                    "uk-UA"
                ) +
                " • ФОП: " +
                allFops.length;


        } catch (error) {

            console.error(
                "Ошибка загрузки:",
                error
            );


            statusDot.classList.add(
                "error"
            );


            statusText.textContent =
                "Помилка синхронізації";


            errorBox.style.display =
                "block";


            errorBox.textContent =
                "Не удалось получить данные.\n\n" +
                error.message;

        }

    }


    /*
     * Статистика сверху.
     */

    function updateStats() {

        const count =
            allFops.length;


        const total =
            allFops.reduce(
                function(sum, fop) {

                    return sum +
                        Number(fop.turnover || 0);

                },
                0
            );


        const free =
            Math.max(
                0,
                ANNUAL_LIMIT - total
            );


        document.getElementById(
            "fopCount"
        ).textContent = count;


        document.getElementById(
            "totalTurnover"
        ).textContent =
            formatMoney(total);


        document.getElementById(
            "freeLimit"
        ).textContent =
            formatMoney(free);

    }


    /*
     * Отрисовка ФОП.
     */

    function renderFops() {

        const list =
            document.getElementById(
                "list"
            );


        const search =
            document.getElementById(
                "search"
            ).value
            .trim()
            .toLowerCase();


        const filtered =
            allFops.filter(
                function(fop) {

                    const name =
                        String(
                            fop.name || ""
                        ).toLowerCase();


                    const inn =
                        String(
                            fop.inn || ""
                        ).toLowerCase();


                    return (
                        name.includes(search) ||
                        inn.includes(search)
                    );

                }
            );


        if (filtered.length === 0) {

            list.innerHTML =
                '<div class="empty">' +
                'ФОП не знайдено' +
                '</div>';

            return;

        }


        list.innerHTML =
            filtered
                .map(
                    function(fop) {

                        return createCard(
                            fop
                        );

                    }
                )
                .join("");

    }


    /*
     * Карточка одного ФОП.
     */

    function createCard(fop) {

        const turnover =
            Number(
                fop.turnover || 0
            );


        const percent =
            getPercent(
                turnover
            );


        const safePercent =
            Math.min(
                100,
                Math.max(
                    0,
                    percent
                )
            );


        const category =
            getCategory(
                percent
            );


        const free =
            Math.max(
                0,
                ANNUAL_LIMIT - turnover
            );


        let categoryText =
            "Безпечно";


        if (category === "watch") {
            categoryText =
                "Увага";
        }

        if (category === "high") {
            categoryText =
                "Високе навантаження";
        }

        if (category === "critical") {
            categoryText =
                "Критично";
        }


        return `

            <div class="card ${category}">

                <div class="card-top">

                    <div>

                        <div class="fop-name">
                            ${escapeHtml(
                                fop.name ||
                                "Не указан"
                            )}
                        </div>

                        <div class="details">

                            ІНН:
                            ${escapeHtml(
                                fop.inn ||
                                "Не указан"
                            )}

                            <br>

                            Банк:
                            ${escapeHtml(
                                fop.banks ||
                                "Не указан"
                            )}

                            <br>

                            Статус:
                            ${categoryText}

                        </div>

                    </div>


                    <div class="percent">

                        ${percent.toFixed(1)}%

                    </div>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar ${category}"
                        style="width: ${safePercent}%"
                    ></div>

                </div>


                <div class="money-row">

                    <span>
                        Дохід
                    </span>

                    <span class="money">
                        ${formatMoney(turnover)}
                    </span>

                </div>


                <div class="money-row">

                    <span>
                        Залишок ліміту
                    </span>

                    <span class="money">
                        ${formatMoney(free)}
                    </span>

                </div>

            </div>

        `;

    }


    /*
     * Защита от HTML в названии ФОП.
     */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
     * Поиск.
     */

    document
        .getElementById("search")
        .addEventListener(
            "input",
            renderFops
        );


    /*
     * Первый запуск.
     */

    loadData();


    /*
     * Автообновление каждые 5 секунд.
     */

    setInterval(
        loadData,
        REFRESH_INTERVAL
    );

</script>

</body>
</html>
