<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FOP Limits Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans">

<div id="root"></div>

<script type="text/babel">

// ============================================================
// НАСТРОЙКИ
// ============================================================

const ANNUAL_LIMIT = 6672000;

const API_URL =
  "https://script.google.com/macros/s/AKfycbyX4JrbmO2ZdOQbIiWYqDWHPsuLiljkBgEzLRhV-mGLrNCsF4Y-4z23eAGcOwhAAYRL/exec?token=my-secure-fop-token-2026";

const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/1mKg2IIYbNauWYe7UC7TI5dKW70rvALAMxzOpdQGqnFQ/edit";

const REFRESH_INTERVAL = 5000;


// ============================================================
// APP
// ============================================================

function App() {

  const [fops, setFops] = React.useState([]);

  const [loading, setLoading] = React.useState(true);

  const [error, setError] = React.useState("");

  const [lastSync, setLastSync] = React.useState("Загрузка...");

  const [search, setSearch] = React.useState("");

  const [filter, setFilter] = React.useState("all");


  // ==========================================================
  // ЗАГРУЗКА ДАННЫХ
  // ==========================================================

  const fetchSheetData = async () => {

    try {

      const response = await fetch(
        API_URL + "&_=" + Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const result = await response.json();

      console.log("API:", result);


      if (result.status !== "success") {
        throw new Error(
          result.error || "Ошибка API"
        );
      }


      if (!Array.isArray(result.data)) {
        throw new Error(
          "API вернул некорректные данные"
        );
      }


      // Обновляем данные
      setFops(result.data);

      setError("");

      setLastSync(
        new Date().toLocaleTimeString("ru-RU")
      );


    } catch (e) {

      console.error(
        "Ошибка синхронизации:",
        e
      );

      setError(
        "Не удалось получить данные"
      );

    } finally {

      setLoading(false);

    }

  };


  // ==========================================================
  // ПЕРВЫЙ ЗАПРОС + АВТООБНОВЛЕНИЕ
  // ==========================================================

  React.useEffect(() => {

    fetchSheetData();

    const interval = setInterval(
      fetchSheetData,
      REFRESH_INTERVAL
    );

    return () => clearInterval(interval);

  }, []);


  // ==========================================================
  // ОБРАБОТКА ФОП
  // ==========================================================

  const processed = React.useMemo(() => {

    return fops.map(fop => {

      const turnover =
        Number(fop.turnover) || 0;


      const pct =
        Math.min(
          100,
          Number(
            ((turnover / ANNUAL_LIMIT) * 100)
              .toFixed(1)
          )
        );


      const remaining =
        ANNUAL_LIMIT - turnover;


      let cat = "safe";

      let label = "Запас";

      let badge =
        "bg-emerald-50 text-emerald-700 border-emerald-200";

      let bar =
        "bg-emerald-500";


      if (pct >= 90) {

        cat = "critical";

        label = "Критично";

        badge =
          "bg-red-50 text-red-600 border-red-200";

        bar =
          "bg-red-500";

      }

      else if (pct >= 80) {

        cat = "high";

        label = "Высокий риск";

        badge =
          "bg-orange-50 text-orange-600 border-orange-200";

        bar =
          "bg-orange-500";

      }

      else if (pct >= 70) {

        cat = "watch";

        label = "Следить";

        badge =
          "bg-amber-50 text-amber-600 border-amber-200";

        bar =
          "bg-amber-400";

      }


      return {
        ...fop,
        turnover,
        pct,
        remaining,
        cat,
        label,
        badge,
        bar
      };

    });

  }, [fops]);


  // ==========================================================
  // СТАТИСТИКА
  // ==========================================================

  const totalTurnover =
    processed.reduce(
      (sum, fop) =>
        sum + fop.turnover,
      0
    );


  const totalFree =
    processed.reduce(
      (sum, fop) =>
        sum +
        Math.max(
          0,
          ANNUAL_LIMIT - fop.turnover
        ),
      0
    );


  // ==========================================================
  // ФИЛЬТРАЦИЯ
  // ==========================================================

  const filtered =
    processed.filter(f => {

      const searchText =
        search.toLowerCase().trim();


      const matchesSearch =
        (f.name || "")
          .toLowerCase()
          .includes(searchText);


      if (filter === "all") {
        return matchesSearch;
      }


      return (
        matchesSearch &&
        f.cat === filter
      );

    });


  // ==========================================================
  // ФОРМАТ ЧИСЕЛ
  // ==========================================================

  const formatMoney = value => {

    return new Intl.NumberFormat(
      "ru-RU"
    ).format(
      Math.round(value)
    ) + " ₴";

  };


  const formatShort = value => {

    if (value >= 1000000) {

      return (
        (value / 1000000)
          .toFixed(1)
          .replace(".", ",")
        + " млн"
      );

    }

    if (value >= 1000) {

      return (
        (value / 1000)
          .toFixed(0)
        + " тыс."
      );

    }

    return formatMoney(value);

  };


  // ==========================================================
  // RENDER
  // ==========================================================

  return (

    <div className="flex min-h-screen">


      {/* SIDEBAR */}

      <aside className="
        w-64
        bg-white
        border-r
        border-slate-200
        p-6
        hidden
        md:block
      ">

        <div className="
          font-bold
          text-xl
          text-slate-900
          mb-8
          flex
          items-center
          gap-2
        ">

          <span className="
            w-8
            h-8
            bg-blue-600
            text-white
            rounded-lg
            flex
            items-center
            justify-center
          ">
            F
          </span>

          FOP Limits

        </div>


        <div className="
          p-3
          bg-slate-100
          text-blue-600
          rounded-lg
          font-medium
          text-sm
        ">

          Дашборд

        </div>

      </aside>


      {/* MAIN */}

      <main className="
        flex-1
        p-6
        md:p-10
        max-w-7xl
      ">


        {/* HEADER */}

        <div className="
          flex
          justify-between
          items-center
          mb-8
        ">

          <div>

            <h1 className="
              text-2xl
              font-bold
              text-slate-900
            ">
              Дашборд
            </h1>


            <p className="
              text-xs
              text-slate-400
              mt-1
            ">

              Доход 2026 •
              Лимит 2 группы:
              6,67 млн ₴

            </p>

          </div>


          <div className="
            text-xs
            text-slate-500
            bg-white
            px-3
            py-2
            rounded-full
            border
            border-slate-200
          ">

            <span className="
              inline-block
              w-2
              h-2
              rounded-full
              bg-emerald-500
              mr-2
            "></span>

            Синхронизировано:
            {" "}
            {lastSync}

          </div>

        </div>


        {/* ERROR */}

        {error && (

          <div className="
            mb-6
            p-4
            bg-red-50
            border
            border-red-200
            text-red-700
            rounded-xl
            text-sm
          ">

            ⚠️ {error}

          </div>

        )}


        {/* STATISTICS */}

        <div className="
          grid
          grid-cols-2
          md:grid-cols-4
          gap-4
          mb-8
        ">


          <div className="
            bg-white
            p-5
            rounded-xl
            border
            border-slate-200
            shadow-sm
          ">

            <div className="
              text-xs
              text-slate-400
            ">
              В красной зоне
            </div>

            <div className="
              text-3xl
              font-bold
              text-red-500
              mt-1
            ">

              {
                processed.filter(
                  f => f.cat === "critical"
                ).length
              }

            </div>

          </div>


          <div className="
            bg-white
            p-5
            rounded-xl
            border
            border-slate-200
            shadow-sm
          ">

            <div className="
              text-xs
              text-slate-400
            ">
              Доход сети
            </div>

            <div className="
              text-3xl
              font-bold
              text-slate-900
              mt-1
            ">

              {formatShort(totalTurnover)}

            </div>

          </div>


          <div className="
            bg-white
            p-5
            rounded-xl
            border
            border-slate-200
            shadow-sm
          ">

            <div className="
              text-xs
              text-slate-400
            ">
              Свободный запас
            </div>

            <div className="
              text-3xl
              font-bold
              text-slate-900
              mt-1
            ">

              {formatShort(totalFree)}

            </div>

          </div>


          <div className="
            bg-white
            p-5
            rounded-xl
            border
            border-slate-200
            shadow-sm
          ">

            <div className="
              text-xs
              text-slate-400
            ">
              Всего ФОП
            </div>

            <div className="
              text-3xl
              font-bold
              text-slate-900
              mt-1
            ">

              {processed.length}

            </div>

          </div>

        </div>


        {/* LIST */}

        <div className="
          bg-white
          rounded-xl
          border
          border-slate-200
          shadow-sm
          p-6
        ">


          {/* FILTERS */}

          <div className="
            flex
            flex-col
            md:flex-row
            justify-between
            gap-4
            mb-6
          ">


            <div className="
              flex
              gap-1
              bg-slate-100
              p-1
              rounded-lg
              text-xs
              font-medium
              overflow-x-auto
            ">

              {[
                "all",
                "critical",
                "high",
                "watch",
                "safe"
              ].map(type => (

                <button
                  key={type}
                  onClick={() =>
                    setFilter(type)
                  }
                  className={`
                    px-3
                    py-1.5
                    rounded-md
                    whitespace-nowrap
                    ${
                      filter === type
                        ? "bg-white text-slate-900 shadow-sm"
                        : "text-slate-600"
                    }
                  `}
                >

                  {
                    type === "all"
                      ? "Все"
                      : type === "critical"
                      ? "Критично"
                      : type === "high"
                      ? "Высокий риск"
                      : type === "watch"
                      ? "Следить"
                      : "Запас"
                  }

                </button>

              ))}

            </div>


            <input
              type="text"
              placeholder="Поиск ФОП..."
              value={search}
              onChange={e =>
                setSearch(e.target.value)
              }
              className="
                px-3
                py-2
                text-xs
                border
                border-slate-200
                rounded-lg
                outline-none
                w-full
                md:w-64
              "
            />

          </div>


          {/* LOADING */}

          {loading ? (

            <div className="
              text-center
              py-12
              text-slate-400
              text-sm
            ">

              Загрузка данных...

            </div>

          ) : filtered.length === 0 ? (

            <div className="
              text-center
              py-12
              text-slate-400
              text-sm
            ">

              ФОП не найдены

            </div>

          ) : (

            <div className="space-y-3">

              {filtered.map(f => (

                <div
                  key={f.id}
                  className="
                    p-4
                    rounded-xl
                    border
                    border-slate-100
                    flex
                    flex-col
                    md:flex-row
                    md:items-center
                    justify-between
                    gap-4
                    hover:border-slate-200
                    transition
                  "
                >


                  {/* NAME */}

                  <div className="md:w-1/3">

                    <div className="
                      font-semibold
                      text-sm
                      text-slate-900
                    ">

                      {f.name}

                    </div>


                    <div className="
                      text-[11px]
                      text-slate-400
                      mt-1
                    ">

                      ИНН {f.inn}
                      {" • "}
                      {f.banks}

                    </div>

                  </div>


                  {/* PROGRESS */}

                  <div className="md:w-1/3">

                    <div className="
                      relative
                      w-full
                      h-8
                      bg-slate-100
                      rounded-lg
                      overflow-hidden
                      flex
                      items-center
                      px-3
                      justify-between
                    ">


                      <div
                        className={`
                          absolute
                          left-0
                          top-0
                          bottom-0
                          ${f.bar}
                          transition-all
                          duration-500
                        `}
                        style={{
                          width: `${f.pct}%`
                        }}
                      ></div>


                      <span className="
                        relative
                        z-10
                        text-[11px]
                        font-medium
                        text-slate-700
                      ">

                        остаток{" "}
                        {formatMoney(
                          Math.max(
                            0,
                            f.remaining
                          )
                        )}

                      </span>


                      <span className="
                        relative
                        z-10
                        text-xs
                        font-bold
                        text-slate-800
                      ">

                        {f.pct}%

                      </span>

                    </div>

                  </div>


                  {/* STATUS */}

                  <div className="
                    flex
                    items-center
                    gap-3
                    justify-between
                    md:justify-end
                  ">


                    <span className={`
                      text-[11px]
                      font-medium
                      px-2.5
                      py-1
                      rounded-md
                      border
                      ${f.badge}
                    `}>

                      {f.label}

                    </span>


                    <a
                      href={SHEET_URL}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="
                        inline-flex
                        items-center
                        gap-1.5
                        px-3
                        py-1.5
                        bg-blue-600
                        hover:bg-blue-700
                        text-white
                        text-xs
                        font-medium
                        rounded-lg
                        transition
                        shadow-sm
                      "
                    >

                      Таблица

                    </a>

                  </div>

                </div>

              ))}

            </div>

          )}

        </div>

      </main>

    </div>

  );
}


// ============================================================
// START
// ============================================================

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App />
  );

</script>

</body>
</html>
