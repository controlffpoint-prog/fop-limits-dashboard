<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOP Limits Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const ANNUAL_LIMIT = 6672000;
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1mKg2IIYbNauWYe7UC7TI5dKW70rvALAMxzOpdQGqnFQ/edit?pli=1&gid=2035595072#gid=2035595072";
    
    // Вставьте сюда вашу ссылку на веб-приложение Apps Script:
    const APPS_SCRIPT_URL = "ВАША_ССЫЛКА_ИЗ_APPS_SCRIPT_ЗДЕСЬ";

    function App() {
      const [fops, setFops] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [search, setSearch] = React.useState("");
      const [filter, setFilter] = React.useState("all");

      const fetchData = async () => {
        try {
          const res = await fetch(APPS_SCRIPT_URL);
          const data = await res.json();
          setFops(data);
          setLoading(false);
        } catch (err) {
          console.error("Ошибка загрузки:", err);
          setLoading(false);
        }
      };

      React.useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 15000); // Проверять обновление каждые 15 секунд
        return () => clearInterval(interval);
      }, []);

      const processed = React.useMemo(() => {
        return fops.map(fop => {
          const pct = Math.min(100, Number(((fop.turnover / ANNUAL_LIMIT) * 100).toFixed(1)));
          const remaining = ANNUAL_LIMIT - fop.turnover;
          let cat = "safe", label = "Запас", badge = "bg-emerald-50 text-emerald-700 border-emerald-200", bar = "bg-emerald-500";
          if (pct >= 90) { cat = "critical"; label = "критично"; badge = "bg-red-50 text-red-600 border-red-200"; bar = "bg-red-500"; }
          else if (pct >= 80) { cat = "high"; label = "высокий риск"; badge = "bg-orange-50 text-orange-600 border-orange-200"; bar = "bg-orange-500"; }
          else if (pct >= 70) { cat = "watch"; label = "следить"; badge = "bg-amber-50 text-amber-600 border-amber-200"; bar = "bg-amber-400"; }
          return { ...fop, pct, remaining, cat, label, badge, bar };
        });
      }, [fops]);

      const totalTurnover = processed.reduce((a, b) => a + b.turnover, 0);
      const totalFree = processed.length * ANNUAL_LIMIT - totalTurnover;

      const filtered = processed.filter(f => {
        const m = f.name.toLowerCase().includes(search.toLowerCase());
        return filter === "all" ? m : m && f.cat === filter;
      });

      const fmt = v => v >= 1000000 ? (v / 1000000).toFixed(1).replace(".", ",") + " млн" : new Intl.NumberFormat("ru-RU").format(v) + " ₴";
