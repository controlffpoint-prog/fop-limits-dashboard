<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOP Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const ANNUAL_LIMIT = 7211598; // Лимит 2 группы на 2026 год
    const API_URL = "https://script.google.com/macros/s/AKfycbx6QBgtoCRK76DnBP1BcpZTMHSnN48GdeCOovQhPfzNp-6LUA2Ee_yNt1rC0uzrsgSi/exec?token=my-secure-fop-token-2026";
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1mKg2IIYbNauWYe7UC7TI5dKW70rvALAMxzOpdQGqnFQ/edit";
    const CORRECT_PASSWORD = "K25dFa00GZ5pRDaRBPvY";

    function App() {
      const [isAuthenticated, setIsAuthenticated] = React.useState(() => {
        return sessionStorage.getItem("fop_auth") === "true";
      });
      const [passwordInput, setPasswordInput] = React.useState("");
      const [errorMsg, setErrorMsg] = React.useState(false);

      const [fops, setFops] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [lastSync, setLastSync] = React.useState("Синхронизация...");
      const [search, setSearch] = React.useState("");
      const [filter, setFilter] = React.useState("all");
      const [sortOrder, setSortOrder] = React.useState("desc");

      const fetchSheetData = async () => {
        try {
          const response = await fetch(API_URL);
          const result = await response.json();
          if (result && result.status === "success" && Array.isArray(result.data)) {
            setFops(result.data);
            setLastSync(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
          }
        } catch (e) {
          console.error("Ошибка синхронизации:", e);
        } finally {
          setLoading(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === CORRECT_PASSWORD) {
          sessionStorage.setItem("fop_auth", "true");
          setIsAuthenticated(true);
        } else {
          setErrorMsg(true);
        }
      };

      React.useEffect(() => {
        if (isAuthenticated) {
          setLoading(true);
          fetchSheetData();
          const interval = setInterval(fetchSheetData, 15000);
          return () => clearInterval(interval);
        }
      }, [isAuthenticated]);

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div className="bg-white/10 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/10 text-white">
              <div className="flex items-center gap-3 mb-6">
                <div className="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-500/30">⚡</div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight">Авторизация</h1>
                  <p className="text-xs text-slate-400">Введите пароль для доступа к системе</p>
                </div>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input 
                    type="password" 
                    placeholder="••••••••••••••••" 
                    value={passwordInput}
                    onChange={(e) => { setPasswordInput(e.target.value); setErrorMsg(false); }}
                    className="w-full px-4 py-3 text-sm bg-slate-900/50 border border-slate-700/60 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition text-white placeholder-slate-600"
                  />
                  {errorMsg && <p className="text-xs text-rose-400 mt-1.5 font-medium">Неверный пароль</p>}
                </div>
                <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-blue-600/30">
                  Войти в систему
                </button>
              </form>
            </div>
          </div>
        );
      }

      const processed = React.useMemo(() => {
        const map = {};

        (fops || []).forEach(item => {
          const nameStr = String(item.name || "").trim();
          const innStr = String(item.inn || "").trim();
          const key = innStr !== "" ? innStr : nameStr;
          
          if (!map[key]) {
            map[key] = {
              id: item.id || key,
              name: nameStr,
              inn: innStr,
              banksBreakdown: []
            };
          }
          
          const bankName = item.banks && String(item.banks).trim() !== "" ? String(item.banks).trim() : "Основной счет";
          const turnoverVal = Number(item.turnover) || 0;
          
          const existingBank = map[key].banksBreakdown.find(b => b.bank.toLowerCase() === bankName.toLowerCase());
          if (existingBank) {
            existingBank.turnover += turnoverVal;
          } else {
            map[key].banksBreakdown.push({ bank: bankName, turnover: turnoverVal });
          }
        });

        const list = Object.values(map).map(fop => {
          const turnover = fop.banksBreakdown.reduce((sum, b) => sum + b.turnover, 0);
          const pct = Math.min(100, Number(((turnover / ANNUAL_LIMIT) * 100).toFixed(1)));
          const remaining = ANNUAL_LIMIT - turnover;
          let cat = "safe", label = "Запас", badge = "bg-emerald-50 text-emerald-700 border-emerald-200/60", bar = "bg-emerald-500";
          if (pct >= 90) { cat = "critical"; label = "Критично"; badge = "bg-rose-50 text-rose-600 border-rose-200/60"; bar = "bg-rose-500"; }
          else if (pct >= 80) { cat = "high"; label = "Высокий риск"; badge = "bg-amber-50 text-amber-700 border-amber-200/60"; bar = "bg-amber-500"; }
          else if (pct >= 70) { cat = "watch"; label = "Следить"; badge = "bg-yellow-50 text-yellow-700 border-yellow-200/60"; bar = "bg-yellow-400"; }
          return { ...fop, turnover, pct, remaining, cat, label, badge, bar };
        });

        return list.sort((a, b) => {
          if (sortOrder === "desc") {
            return b.remaining - a.remaining;
          } else {
            return a.remaining - b.remaining;
          }
        });
      }, [fops, sortOrder]);

      const totalTurnover = processed.reduce((a, b) => a + b.turnover, 0);
      const totalFree = processed.length * ANNUAL_LIMIT - totalTurnover;

      const filtered = processed.filter(f => {
        const query = String(search || "").toLowerCase();
        const matchName = String(f.name || "").toLowerCase().includes(query);
        const matchInn = String(f.inn || "").toLowerCase().includes(query);
        const matchBank = f.banksBreakdown.some(b => String(b.bank || "").toLowerCase().includes(query));
        const matchesSearch = matchName || matchInn || matchBank;
        return filter === "all" ? matchesSearch : matchesSearch && f.cat === filter;
      });

      const fmt = v => v >= 1000000 ? (v / 1000000).toFixed(1).replace(".", ",") + " млн" : new Intl.NumberFormat("ru-RU").format(v) + " ₴";

      return (
        <div className="flex min-h-screen bg-[#f8fafc]">
          <aside className="w-72 bg-white border-r border-slate-200/80 p-6 hidden lg:flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 mb-10 px-2">
                <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-md shadow-blue-500/20">⚡</div>
                <div>
                  <span className="font-bold text-slate-900 tracking-tight text-base block">FOP Limits</span>
                  <span className="text-[11px] text-slate-400 font-medium">Financial Monitoring</span>
                </div>
              </div>
              <nav className="space-y-1 text-sm font-medium">
                <a href="#" className="flex items-center gap-3 px-3.5 py-2.5 bg-blue-50/80 text-blue-600 rounded-xl font-semibold transition">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                  Дашборд
                </a>
              </nav>
            </div>
            <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100 text-xs text-slate-500">
              <div className="font-semibold text-slate-700 mb-1">Лимит 2 группы (2026)</div>
              <p className="text-[11px] text-slate-400 leading-relaxed">7 211 598 ₴ на один ФОП за календарный год.</p>
            </div>
          </aside>

          <main className="flex-1 p-6 md:p-10 max-w-7xl mx-auto overflow-hidden">
            <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-slate-200/60">
              <div>
                <h1 className="text-2xl font-bold tracking-tight text-slate-900">Обзор лимитов ФОП</h1>
                <p className="text-xs text-slate-500 mt-0.5">Оперативный контроль общих лимитов и оборотов по банкам • 2026 год</p>
              </div>
              <div className="flex items-center gap-3">
                <a 
                  href={SHEET_URL} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition shadow-sm"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                  <span>Открыть таблицу</span>
                </a>
                <div className="flex items-center gap-2 text-xs font-medium text-slate-600 bg-white px-3.5 py-2 rounded-xl border border-slate-200/80 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 
                  <span>Синхронизировано: {lastSync}</span>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">В красной зоне</div>
                <div className="text-3xl font-extrabold text-rose-600">{processed.filter(f => f.cat === "critical" || f.cat === "high").length}</div>
                <div className="text-[11px] text-slate-400 mt-1">Требуют внимания</div>
              </div>
              <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Доход сети</div>
                <div className="text-3xl font-extrabold text-slate-900">{fmt(totalTurnover)}</div>
                <div className="text-[11px] text-slate-400 mt-1">Суммарный оборот</div>
              </div>
              <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Свободный запас</div>
                <div className="text-3xl font-extrabold text-emerald-600">{fmt(totalFree)}</div>
                <div className="text-[11px] text-slate-400 mt-1">До лимитов сети</div>
              </div>
              <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Всего ФОП</div>
                <div className="text-3xl font-extrabold text-slate-900">{processed.length}</div>
                <div className="text-[11px] text-slate-400 mt-1">Активных субъектов</div>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div className="flex flex-wrap gap-1.5 bg-slate-100/80 p-1 rounded-xl text-xs font-medium">
                  {[
                    { id: "all", label: "Все" },
                    { id: "critical", label: "Критично" },
                    { id: "high", label: "Высокий риск" },
                    { id: "watch", label: "Следить" },
                    { id: "safe", label: "Запас" }
                  ].map(t => (
                    <button 
                      key={t.id} 
                      onClick={() => setFilter(t.id)} 
                      className={`px-3.5 py-2 rounded-lg whitespace-nowrap transition font-medium ${filter === t.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-900"}`}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-2 w-full sm:w-auto">
                  <button 
                    onClick={() => setSortOrder(prev => prev === "desc" ? "asc" : "desc")} 
                    title="Изменить порядок сортировки по остатку"
                    className="flex items-center gap-1.5 px-3 py-2 text-xs font-medium bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-xl transition"
                  >
                    <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      {sortOrder === "desc" ? (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" />
                      ) : (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4" />
                      )}
                    </svg>
                    <span>{sortOrder === "desc" ? "Больше остаток" : "Меньше остаток"}</span>
                  </button>

                  <div className="relative flex-1 sm:flex-initial">
                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input 
                      type="text" 
                      placeholder="Поиск по ФОП, ІПН или банку..." 
                      value={search} 
                      onChange={e => setSearch(e.target.value)} 
                      className="pl-9 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white transition w-full sm:w-60" 
                    />
                  </div>
                </div>
              </div>

              {loading ? (
                <div className="text-center py-16 text-slate-400 text-sm flex flex-col items-center justify-center gap-3">
                  <div className="w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                  Загрузка актуальных данных...
                </div>
              ) : filtered.length === 0 ? (
                <div className="text-center py-16 text-slate-400 text-sm">Ничего не найдено</div>
              ) : (
                <div className="space-y-3">
                  {filtered.map(f => (
                    <div key={f.id} className="group p-4 rounded-2xl border border-slate-100 bg-white hover:border-slate-200 hover:shadow-md transition-all duration-200 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                      
                      <div className="lg:w-1/3">
                        <div className="font-bold text-sm text-slate-900 group-hover:text-blue-600 transition">{f.name}</div>
                        <div className="text-xs text-slate-400 mt-1 flex items-center gap-2">
                          <span className="bg-slate-100 px-1.5 py-0.5 rounded text-[10px] font-mono font-medium text-slate-600">ІПН {f.inn || "—"}</span>
                        </div>
                      </div>
                      
                      <div className="lg:w-2/5 space-y-2">
                        <div>
                          <div className="flex justify-between items-center text-[11px] mb-1">
                            <span className="font-semibold text-slate-600">Общий лимит (остаток {new Intl.NumberFormat("ru-RU").format(f.remaining)} ₴)</span>
                            <span className="font-bold text-slate-900">{f.pct}%</span>
                          </div>
                          <div className="relative w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                            <div className={`absolute left-0 top-0 bottom-0 ${f.bar} transition-all duration-500 rounded-full`} style={{ width: `${f.pct}%` }}></div>
                          </div>
                        </div>

                        <div className="space-y-1.5 pt-1 border-t border-slate-100">
                          {f.banksBreakdown.map((b, idx) => {
                            const bankPct = Math.min(100, Number(((b.turnover / ANNUAL_LIMIT) * 100).toFixed(1)));
                            return (
                              <div key={idx} className="bg-slate-50 p-2 rounded-xl border border-slate-100">
                                <div className="flex justify-between items-center text-[10px] mb-1">
                                  <span className="font-semibold text-slate-700">{b.bank}</span>
                                  <span className="font-bold text-slate-900">{new Intl.NumberFormat("ru-RU").format(b.turnover)} ₴ ({bankPct}%)</span>
                                </div>
                                <div className="relative w-full h-1.5 bg-slate-200/70 rounded-full overflow-hidden">
                                  <div className="absolute left-0 top-0 bottom-0 bg-blue-500 rounded-full transition-all duration-300" style={{ width: `${bankPct}%` }}></div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="flex items-center gap-3 justify-end lg:w-auto">
                        <div className="text-right hidden sm:block">
                          <div className="text-[10px] uppercase font-semibold text-slate-400">Разом оборот</div>
                          <div className="text-xs font-bold text-slate-800">{new Intl.NumberFormat("ru-RU").format(f.turnover)} ₴</div>
                        </div>
                        <span className={`text-xs font-semibold px-3 py-1.5 rounded-xl border ${f.badge}`}>{f.label}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    document.getElementById("root") && ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
