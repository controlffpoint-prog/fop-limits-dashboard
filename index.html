<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг Лимитов ФОП</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 w-full max-w-md text-center">
      <h1 class="text-2xl font-bold mb-4">Вход в систему</h1>
      <form onsubmit="handleAuth(event)" class="space-y-4">
        <input type="password" id="password-input" placeholder="Пароль" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-white">
        <p id="auth-error" class="text-rose-400 text-xs hidden">Неверный пароль</p>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium">Войти</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen p-6 max-w-7xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700">
      <h1 class="text-xl font-bold">Мониторинг Лимитов ФОП 2026</h1>
      <button onclick="fetchData()" class="px-4 py-2 bg-indigo-600 rounded-xl text-sm font-medium">Обновить</button>
    </div>

    <!-- Status -->
    <div id="loading" class="text-center py-12 text-slate-400">Загрузка данных...</div>
    <div id="error-state" class="hidden text-center py-12 text-rose-400">
      <p id="error-text">Не удалось загрузить данные.</p>
      <button onclick="fetchData()" class="mt-4 px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">Повторить</button>
    </div>

    <!-- Grid -->
    <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </div>

  <script>
    const CORRECT_PASSWORD = "K25dFa00GZ5pRDaRBPvY";
    const API_URL = "https://script.google.com/macros/s/AKfycb_jNqlXVuO2m9fNQ39-n6m38wY2a16UDOT7LULgmymV1cBRRojozx9ndK4HJpaVoeO/exec?token=my-secure-fop-token-2026";
    const ANNUAL_LIMIT = 8285700;

    function handleAuth(e) {
      e.preventDefault();
      if (document.getElementById('password-input').value === CORRECT_PASSWORD) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        fetchData();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    async function fetchData() {
      const loading = document.getElementById('loading');
      const errorState = document.getElementById('error-state');
      const grid = document.getElementById('cards-grid');

      loading.classList.remove('hidden');
      errorState.classList.add('hidden');
      grid.innerHTML = '';

      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        
        let rawList = [];
        if (Array.isArray(json)) rawList = json;
        else if (json.data && Array.isArray(json.data)) rawList = json.data;
        else if (json.status === 'success' && json.data) rawList = json.data;

        if (!rawList || rawList.length === 0) {
          throw new Error('Данные получены, но список ФОП пуст или имеет неверный формат.');
        }

        renderCards(rawList);
      } catch (err) {
        console.error("Ошибка:", err);
        document.getElementById('error-text').textContent = err.message || 'Ошибка сети/CORS';
        errorState.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
      }
    }

    function renderCards(list) {
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = list.map(item => {
        const used = Number(item.turnover) || 0;
        const remaining = Math.max(0, ANNUAL_LIMIT - used);
        const percent = Math.min(Math.round((used / ANNUAL_LIMIT) * 100), 100);

        return `
          <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-white text-lg">${item.name || 'Без имени'}</h3>
                <p class="text-xs text-slate-400 font-mono">ИНН: ${item.inn || '—'}</p>
              </div>
              <span class="text-xs px-2 py-1 rounded bg-slate-700 text-slate-300">${item.banks || '—'}</span>
            </div>

            <div class="space-y-1">
              <div class="flex justify-between text-xs text-slate-400">
                <span>Использовано:</span>
                <span class="font-bold text-white">${percent}%</span>
              </div>
              <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden">
                <div class="h-full bg-indigo-500" style="width: ${percent}%"></div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 text-xs border-t border-slate-700/50">
              <div>
                <span class="text-slate-400 block">Оборот:</span>
                <span class="font-bold text-slate-200">${used.toLocaleString('uk-UA')} ₴</span>
              </div>
              <div>
                <span class="text-slate-400 block">Остаток:</span>
                <span class="font-bold ${remaining < 500000 ? 'text-rose-400' : 'text-emerald-400'}">${remaining.toLocaleString('uk-UA')} ₴</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
