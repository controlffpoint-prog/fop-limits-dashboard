<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг Лимитов ФОП</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-light {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-light {
      animation: pulse-light 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-2 flex items-center gap-2 z-50 text-sm font-medium border border-indigo-400/30">
    <i data-lucide="check-circle" class="w-4 h-4"></i>
    <span id="toast-text">Скопировано!</span>
  </div>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-md p-8 rounded-2xl border border-slate-700/60 shadow-2xl w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex p-3 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 mb-4 text-indigo-400">
          <i data-lucide="lock" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">ФОП Лимиты</h1>
        <p class="text-slate-400 text-sm mt-1">Введите пароль для доступа к дашборду</p>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <input 
            type="password" 
            id="password-input" 
            placeholder="Пароль доступа"
            class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-center tracking-widest"
            required
            autofocus
          >
        </div>
        <p id="auth-error" class="text-rose-400 text-xs text-center hidden flex items-center justify-center gap-1">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Неверный пароль
        </p>
        <button 
          type="submit"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium transition shadow-lg shadow-indigo-600/20 active:scale-[0.99]"
        >
          Войти в систему
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-800/50 border-b border-slate-800 backdrop-blur-md sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
          <div class="flex items-center gap-3">
            <div class="p-2 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400">
              <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
            </div>
            <div>
              <h1 class="text-lg font-bold text-white tracking-tight leading-tight">Мониторинг Лимитов ФОП</h1>
              <span id="last-updated" class="text-xs text-slate-400">Загрузка...</span>
            </div>
          </div>
          <button onclick="logout()" class="sm:hidden p-2 text-slate-400 hover:text-rose-400 transition">
            <i data-lucide="log-out" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
          <button 
            onclick="fetchData()" 
            id="refresh-btn" 
            class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-slate-700/60 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium border border-slate-600/50 transition active:scale-95"
          >
            <i data-lucide="refresh-cw" id="refresh-icon" class="w-4 h-4"></i>
            <span>Обновить</span>
          </button>
          <button 
            onclick="logout()" 
            class="hidden sm:flex items-center gap-2 px-3 py-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl text-sm font-medium transition"
          >
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">
      
      <!-- Controls & Search Bar -->
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        <!-- Search Input -->
        <div class="relative w-full md:w-80">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Поиск по ФИО, ИНН или банку..." 
            oninput="renderCards()"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition"
          >
        </div>

        <!-- Filters & Sorting -->
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-start md:justify-end">
          <select 
            id="sort-select" 
            onchange="renderCards()"
            class="px-3 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-xs text-slate-300 focus:outline-none focus:border-indigo-500"
          >
            <option value="percent-desc">Сначала критичные (% расхода)</option>
            <option value="remaining-desc">По наибольшему остатку (₴)</option>
            <option value="remaining-asc">По наименьшему остатку (₴)</option>
            <option value="name-asc">По алфавиту (ФИО)</option>
          </select>

          <div class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700/80 text-xs font-medium">
            <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-lg transition text-white bg-indigo-600">Все</button>
            <button onclick="setFilter('green')" id="filter-green" class="px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white">Безопасные</button>
            <button onclick="setFilter('yellow')" id="filter-yellow" class="px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white">Внимание</button>
            <button onclick="setFilter('red')" id="filter-red" class="px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white">Риск</button>
          </div>
        </div>
      </div>

      <!-- Overview Stats Header -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="stats-container">
        <!-- JS Inject -->
      </div>

      <!-- Loading State -->
      <div id="loading" class="py-20 text-center">
        <div class="inline-block p-4 bg-slate-800/60 rounded-2xl border border-slate-700/50 mb-3">
          <i data-lucide="loader" class="w-8 h-8 text-indigo-400 animate-spin"></i>
        </div>
        <p class="text-slate-400 text-sm">Получение данных из таблицы...</p>
      </div>

      <!-- Error State -->
      <div id="error-state" class="hidden py-16 text-center">
        <div class="inline-block p-4 bg-rose-500/10 rounded-2xl border border-rose-500/20 mb-3 text-rose-400">
          <i data-lucide="alert-triangle" class="w-8 h-8"></i>
        </div>
        <h3 class="text-base font-semibold text-white">Ошибка загрузки данных</h3>
        <p id="error-text" class="text-slate-400 text-xs mt-1 max-w-md mx-auto">Не удалось подключиться к Google Apps Script.</p>
        <button onclick="fetchData()" class="mt-4 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-white rounded-xl border border-slate-700">
          Повторить попытку
        </button>
      </div>

      <!-- Grid Cards Container -->
      <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Cards generated by JS -->
      </div>

    </main>
  </div>

  <script>
    const CORRECT_PASSWORD = "K25dFa00GZ5pRDaRBPvY";
    const ANNUAL_LIMIT = 8285700; // Лимит 3 группы ФОП за 2026 год
    
    // Новая рабочая ссылка на Google Apps Script с токеном
    const API_URL = "https://script.google.com/macros/s/AKfycb_jNqlXVuO2m9fNQ39-n6m38wY2a16UDOT7LULgmymV1cBRRojozx9ndK4HJpaVoeO/exec?token=my-secure-fop-token-2026";

    let fopData = [];
    let currentFilter = 'all';

    // Check Auth
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (sessionStorage.getItem('fop_authenticated') === 'true') {
        showDashboard();
      }
    });

    function handleAuth(e) {
      e.preventDefault();
      const pwd = document.getElementById('password-input').value;
      if (pwd === CORRECT_PASSWORD) {
        sessionStorage.setItem('fop_authenticated', 'true');
        showDashboard();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    function logout() {
      sessionStorage.removeItem('fop_authenticated');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      fetchData();
    }

    async function fetchData() {
      const loading = document.getElementById('loading');
      const errorState = document.getElementById('error-state');
      const cardsGrid = document.getElementById('cards-grid');
      const refreshIcon = document.getElementById('refresh-icon');

      loading.classList.remove('hidden');
      errorState.classList.add('hidden');
      cardsGrid.innerHTML = '';
      refreshIcon.classList.add('animate-spin');

      try {
        const response = await fetch(API_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) throw new Error('Ошибка сети: ' + response.statusText);
        const result = await response.json();
        
        if (result.status === 'error') {
          throw new Error(result.message || 'Ошибка в Google Таблице');
        }

        const rawList = Array.isArray(result) ? result : (result.data || []);
        fopData = parseResponse(rawList);

        document.getElementById('last-updated').textContent = `Обновлено: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        
        renderStats();
        renderCards();
      } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById('error-text').textContent = err.message || 'Не удалось получить данные';
        errorState.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        refreshIcon.classList.remove('animate-spin');
      }
    }

    function parseResponse(rawList) {
      return rawList.map(item => {
        const limit = ANNUAL_LIMIT;
        const used = Number(item.turnover) || 0;
        const remaining = Math.max(0, limit - used);
        const percent = Math.min(Math.round((used / limit) * 100), 100);

        let risk = 'green';
        if (percent >= 90) risk = 'red';
        else if (percent >= 75) risk = 'yellow';

        return {
          id: item.id,
          name: item.name || 'Неизвестный ФОП',
          inn: item.inn || 'Не указан',
          bank: item.banks || '—',
          limit: limit,
          used: used,
          remaining: remaining,
          percent: percent,
          risk: risk
        };
      });
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'green', 'yellow', 'red'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = "px-3 py-1.5 rounded-lg transition text-white bg-indigo-600";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white";
        }
      });
      renderCards();
    }

    function renderStats() {
      const container = document.getElementById('stats-container');
      const totalFops = fopData.length;
      const redCount = fopData.filter(d => d.risk === 'red').length;
      const yellowCount = fopData.filter(d => d.risk === 'yellow').length;
      const totalUsed = fopData.reduce((acc, d) => acc + d.used, 0);

      container.innerHTML = `
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-400 font-medium">Всего ФОП</p>
            <p class="text-xl font-bold text-white mt-1">${totalFops}</p>
          </div>
          <div class="p-2.5 bg-slate-700/50 text-slate-300 rounded-xl">
            <i data-lucide="users" class="w-5 h-5"></i>
          </div>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-400 font-medium">В опасной зоне (>90%)</p>
            <p class="text-xl font-bold text-rose-400 mt-1">${redCount}</p>
          </div>
          <div class="p-2.5 bg-rose-500/10 text-rose-400 rounded-xl border border-rose-500/20">
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
          </div>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-400 font-medium">Требуют внимания (75-90%)</p>
            <p class="text-xl font-bold text-amber-400 mt-1">${yellowCount}</p>
          </div>
          <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
            <i data-lucide="alert-triangle" class="w-5 h-5"></i>
          </div>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-400 font-medium">Общий оборот группы</p>
            <p class="text-lg font-bold text-indigo-300 mt-1">${formatCurrency(totalUsed)}</p>
          </div>
          <div class="p-2.5 bg-indigo-500/10 text-indigo-400 rounded-xl border border-indigo-500/20">
            <i data-lucide="wallet" class="w-5 h-5"></i>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderCards() {
      const grid = document.getElementById('cards-grid');
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const sort = document.getElementById('sort-select').value;

      let list = fopData.filter(item => {
        if (currentFilter !== 'all' && item.risk !== currentFilter) return false;

        if (search) {
          const matchName = item.name.toLowerCase().includes(search);
          const matchInn = item.inn.includes(search);
          const matchBank = item.bank.toLowerCase().includes(search);
          if (!matchName && !matchInn && !matchBank) return false;
        }

        return true;
      });

      // Сортировка
      list.sort((a, b) => {
        if (sort === 'percent-desc') return b.percent - a.percent;
        if (sort === 'remaining-desc') return b.remaining - a.remaining;
        if (sort === 'remaining-asc') return a.remaining - b.remaining;
        if (sort === 'name-asc') return a.name.localeCompare(b.name);
        return 0;
      });

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500 text-sm">
            Ничего не найдено по вашему запросу.
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(item => {
        let riskBadge = '';
        let progressBarColor = 'bg-emerald-500';

        if (item.risk === 'red') {
          riskBadge = `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 flex items-center gap-1"><i data-lucide="alert-octagon" class="w-3.5 h-3.5"></i> Критично</span>`;
          progressBarColor = 'bg-rose-500';
        } else if (item.risk === 'yellow') {
          riskBadge = `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Внимание</span>`;
          progressBarColor = 'bg-amber-500';
        } else {
          riskBadge = `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> В норме</span>`;
        }

        return `
          <div class="bg-slate-800/80 rounded-2xl border border-slate-800 p-5 shadow-lg flex flex-col justify-between transition hover:border-slate-700">
            
            <div>
              <!-- Top Row: Name & Status -->
              <div class="flex items-start justify-between gap-2 mb-3">
                <div>
                  <h3 class="font-bold text-white text-base leading-snug">${item.name}</h3>
                  <div class="flex items-center gap-2 mt-1">
                    <button 
                      onclick="copyToClipboard('${item.inn}')" 
                      title="Нажмите, чтобы скопировать ИНН"
                      class="text-xs font-mono text-slate-400 hover:text-indigo-300 flex items-center gap-1 transition"
                    >
                      <i data-lucide="copy" class="w-3 h-3"></i>
                      <span>${item.inn}</span>
                    </button>
                  </div>
                </div>
                ${riskBadge}
              </div>

              <!-- Bank Badge -->
              <div class="mb-4">
                <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-700/60 text-slate-300 border border-slate-600/40">
                  🏦 ${item.bank}
                </span>
              </div>

              <!-- Progress Bar -->
              <div class="space-y-1.5 my-4">
                <div class="flex justify-between text-xs">
                  <span class="text-slate-400">Израсходовано лимита</span>
                  <span class="font-semibold text-white">${item.percent}%</span>
                </div>
                <div class="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                  <div class="h-full ${progressBarColor} rounded-full transition-all duration-500" style="width: ${item.percent}%"></div>
                </div>
              </div>

              <!-- Financial Details Grid -->
              <div class="grid grid-cols-2 gap-2 p-3 bg-slate-900/60 rounded-xl border border-slate-800 text-xs">
                <div>
                  <span class="text-slate-500 block text-[11px]">Оборот (Оплата)</span>
                  <span class="font-semibold text-slate-200 mt-0.5 block">${formatCurrency(item.used)}</span>
                </div>
                <div>
                  <span class="text-slate-500 block text-[11px]">Остаток Лимита</span>
                  <span class="font-bold ${item.remaining < 500000 ? 'text-rose-400' : 'text-emerald-400'} mt-0.5 block">
                    ${formatCurrency(item.remaining)}
                  </span>
                </div>
              </div>
            </div>

            <!-- Footer: Limit Total -->
            <div class="mt-4 pt-3 border-t border-slate-700/40 flex justify-between items-center text-[11px] text-slate-400">
              <span>Годовой лимит (3 гр):</span>
              <span class="font-medium text-slate-300">${formatCurrency(item.limit)}</span>
            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function formatCurrency(val) {
      return new Intl.NumberFormat('uk-UA', { style: 'currency', currency: 'UAH', maximumFractionDigits: 0 }).format(val);
    }

    function copyToClipboard(text) {
      if (!text || text === 'Не указан') return;
      navigator.clipboard.writeText(text);
      
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = `ИНН ${text} скопирован`;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      }, 2000);
    }
  </script>
</body>
</html>
