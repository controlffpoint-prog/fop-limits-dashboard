  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }
    
    /* Эффект матового стекла */
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card-hover {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card-hover:hover {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(234, 139, 30, 0.35);
      box-shadow: 0 10px 30px -10px rgba(234, 139, 30, 0.18);
      transform: translateY(-2px);
    }

    /* Градиентный фоновый паттерн */
    .bg-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    /* Анимация появления Toast */
    @keyframes popIn {
      from { transform: translateY(100%) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-toast {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

    function App() {
      const [authToken, setAuthToken] = React.useState(() => {
        return sessionStorage.getItem("fop_token") || "";
      });
      const isAuthenticated = !!authToken;
      const [passwordInput, setPasswordInput] = React.useState("");
      const [errorMsg, setErrorMsg] = React.useState(false);
      const [isLoggingIn, setIsLoggingIn] = React.useState(false);
      const [fetchError, setFetchError] = React.useState("");

      const [fops, setFops] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [isSyncing, setIsSyncing] = React.useState(false);
      const [lastSync, setLastSync] = React.useState("Синхронизация...");
      const [search, setSearch] = React.useState("");
      const [filter, setFilter] = React.useState("all");
      const [sortOrder, setSortOrder] = React.useState("desc");

      const [toast, setToast] = React.useState({ show: false, message: "" });

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 2500);
      };

      const copyToClipboard = (text, label) => {
        if (!text || text === "—") return;
        navigator.clipboard.writeText(text);
        showToast(`${label} скопирован! 🚀`);
      };

      const fetchSheetData = async (manual = false, tokenOverride = null) => {
        const token = tokenOverride || authToken;
        if (!token) return null;
        if (manual) setIsSyncing(true);
        try {
          const response = await fetch(`${BASE_API_URL}?token=${encodeURIComponent(token)}`);
          const result = await response.json();
          if (result && result.status === "success" && Array.isArray(result.data)) {
            setFops(result.data);
            setLastSync(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            setFetchError("");
            return result;
          }
          if (result && result.error === "Unauthorized") {
            // Токен больше не действителен (например, сброшен) — выходим из панели
            sessionStorage.removeItem("fop_token");
            setAuthToken("");
            setFetchError("Сессия истекла, войдите заново");
          } else {
            setFetchError("Не удалось загрузить данные с листа");
          }
          return result;
        } catch (e) {
          console.error("Ошибка синхронизации:", e);
          setFetchError("Нет соединения с сервером");
          return null;
        } finally {
          setLoading(false);
          if (manual) setIsSyncing(false);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const candidate = passwordInput.trim();
        if (!candidate) return;
        setIsLoggingIn(true);
        setErrorMsg(false);
        // Пароль отправляется на Apps Script и проверяется там — на клиенте
        // никакие пароли или токены больше не хранятся в открытом виде.
        const result = await fetchSheetData(false, candidate);
        setIsLoggingIn(false);
        if (result && result.status === "success") {
          sessionStorage.setItem("fop_token", candidate);
          setAuthToken(candidate);
        } else {
          setErrorMsg(true);
        }
      };

      React.useEffect(() => {
        if (isAuthenticated) {
          setLoading(true);
          fetchSheetData();
          const interval = setInterval(() => fetchSheetData(false), 15000);
          return () => clearInterval(interval);
        }
      }, [isAuthenticated]);

      // ВАЖНО: раньше здесь стоял ранний `if (!isAuthenticated) return (...)`
      // ПЕРЕД этим useMemo — из-за этого на экране входа React вызывал на
      // один хук меньше, чем на экране дашборда. Это нарушение "Rules of
      // Hooks" (число хуков должно быть одинаковым на каждом рендере одного
      // и того же компонента), и именно из-за него после ввода пароля экран
      // "зависал" — React сбивался и переставал корректно обновлять этот
      // компонент, пока не помогала полная перезагрузка страницы. Теперь
      // все хуки (включая этот useMemo) вызываются всегда, а условный показ
      // экрана входа сделан ПОСЛЕ них — см. ниже.
      const processed = React.useMemo(() => {
        const list = (fops || []).map(item => {
          const turnover = Number(item.turnover) || 0;
          const pct = Math.min(100, Number(((turnover / ANNUAL_LIMIT) * 100).toFixed(1)));
          const remaining = ANNUAL_LIMIT - turnover;
          const banks = item.banks || item.bank || "—";
          
          let cat = "safe", label = "Запас 👍", badge = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20", bar = "bg-gradient-to-r from-emerald-500 to-teal-400";
          if (pct >= 90) { cat = "critical"; label = "Критично 🚨"; badge = "bg-rose-500/10 text-rose-400 border-rose-500/20"; bar = "bg-gradient-to-r from-rose-500 to-pink-500"; }
          else if (pct >= 80) { cat = "high"; label = "Высокий риск ⚠️"; badge = "bg-amber-500/10 text-amber-400 border-amber-500/20"; bar = "bg-gradient-to-r from-amber-500 to-orange-400"; }
          else if (pct >= 70) { cat = "watch"; label = "Следить 👀"; badge = "bg-yellow-500/10 text-yellow-300 border-yellow-500/20"; bar = "bg-gradient-to-r from-yellow-400 to-amber-300"; }
          
          return { ...item, turnover, pct, remaining, banks, cat, label, badge, bar };
        });

        return list.sort((a, b) => sortOrder === "desc" ? b.remaining - a.remaining : a.remaining - b.remaining);
      }, [fops, sortOrder]);

      const totalTurnover = processed.reduce((a, b) => a + b.turnover, 0);
      const totalFree = (processed.length * ANNUAL_LIMIT) - totalTurnover;

      const filtered = processed.filter(f => {
        const query = String(search || "").toLowerCase();
        const matchName = String(f.name || "").toLowerCase().includes(query);
        const matchInn = String(f.inn || "").toLowerCase().includes(query);
        const matchBanks = String(f.banks || "").toLowerCase().includes(query);
        const matchesSearch = matchName || matchInn || matchBanks;
        return filter === "all" ? matchesSearch : matchesSearch && f.cat === filter;
      });

      const fmt = v => v >= 1000000 ? (v / 1000000).toFixed(1).replace(".", ",") + " млн" : new Intl.NumberFormat("ru-RU").format(v) + " ₴";

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 relative z-10">
            <div className="glass-card p-8 rounded-3xl w-full max-w-md border border-white/10 shadow-2xl">
              <div className="flex flex-col items-center text-center mb-7">
                <img src={LOGO_URI} alt="Point Fulfillment" className="h-12 w-auto mb-4" />
                <h1 className="text-xl font-bold tracking-tight text-white">Добро пожаловать</h1>
                <p className="text-xs text-slate-400 mt-1">Введите пароль команды</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">

                    type="password" 
                    placeholder="••••••••••••••••" 
                    value={passwordInput}
                    onChange={(e) => { setPasswordInput(e.target.value); setErrorMsg(false); }}
                    className="w-full px-4 py-3 text-sm bg-slate-900/80 border border-slate-700/60 rounded-xl outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition text-white placeholder-slate-600"
                  />
                  {errorMsg && <p className="text-xs text-rose-400 mt-2 font-medium">Неверный пароль 🔥</p>}
                </div>
                <button type="submit" disabled={isLoggingIn} className="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 active:scale-[0.98] text-white text-sm font-bold rounded-xl transition shadow-lg shadow-orange-500/25 disabled:opacity-60">
                  {isLoggingIn ? "Проверяем…" : "Войти в панель"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex min-h-screen relative z-10">
          
          {/* TOAST NOTIFICATION */}
          {toast.show && (
            <div className="fixed bottom-6 right-6 z-50 animate-toast">
              <div className="glass-card text-white px-4 py-3 rounded-2xl shadow-2xl border border-orange-500/30 flex items-center gap-2.5 text-xs font-semibold backdrop-blur-2xl">
                <span className="text-base">✨</span>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className="w-72 glass-card border-r border-white/5 p-6 hidden lg:flex flex-col justify-between rounded-r-3xl my-4 ml-4">
            <div>
              <div className="mb-10 px-2">
                <img src={LOGO_URI} alt="Point Fulfillment" className="h-9 w-auto mb-2" />
                <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Dashboard 2026 · Мониторинг лимитов ФОП</span>
              </div>
              <nav className="space-y-1.5 text-xs font-semibold">
                <a href="#" className="flex items-center gap-3 px-4 py-3 bg-orange-500/10 text-orange-400 border border-orange-500/20 rounded-xl transition">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                  Обзор ФОП
                </a>
              </nav>
            </div>
            
            <div className="p-4 rounded-2xl bg-white/5 border border-white/5 text-xs text-slate-400 space-y-1">
              <div className="font-semibold text-slate-200">Лимит 2 группы 🎯</div>
              <p className="text-[11px] text-slate-400">7 211 598 ₴ / год на один ФОП</p>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 p-6 md:p-10 max-w-7xl mx-auto overflow-hidden">
            <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-white/5">
              <div>
                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                  <span>Мониторинг лимитов</span>
                  <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-orange-500/10 text-orange-400 border border-orange-500/20">2026</span>
                </h1>
                <p className="text-xs text-slate-400 mt-1">Автоматический отслеживатель расходов по ФОП</p>
              </div>
              
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 text-xs font-medium text-slate-300 glass-card px-3.5 py-2.5 rounded-xl border border-white/10">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 
                  <span className="text-[11px]">{lastSync}</span>
                </div>
              </div>
            </header>

            {fetchError && (
              <div className="mb-6 px-4 py-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-semibold">
                ⚠️ {fetchError}
              </div>
            )}

            {/* МЕТРИКИ */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div className="glass-card p-5 rounded-2xl border border-white/5">
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Красная зона 🔥</div>
                <div className="text-3xl font-black text-rose-400">{processed.filter(f => f.cat === "critical" || f.cat === "high").length}</div>
                <div className="text-[11px] text-slate-500 mt-1">Требуют внимания</div>
              </div>

              <div className="glass-card p-5 rounded-2xl border border-white/5">
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Всего расходов 💳</div>
                <div className="text-3xl font-black text-white">{fmt(totalTurnover)}</div>
                <div className="text-[11px] text-slate-500 mt-1">За текущий год</div>
              </div>

              <div className="glass-card p-5 rounded-2xl border border-white/5">
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Запас сети 🛡️</div>
                <div className="text-3xl font-black text-emerald-400">{fmt(totalFree)}</div>
                <div className="text-[11px] text-slate-500 mt-1">Свободно к освоению</div>
              </div>

              <div className="glass-card p-5 rounded-2xl border border-white/5">
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Активные ФОП 👥</div>
                <div className="text-3xl font-black text-orange-400">{processed.length}</div>
                <div className="text-[11px] text-slate-500 mt-1">В системе</div>
              </div>
            </div>

            {/* ОСНОВНОЙ БЛОК */}
            <div className="glass-card rounded-3xl p-6 border border-white/5">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                
                {/* Фильтры */}
                <div className="flex flex-wrap gap-1.5 bg-slate-900/80 p-1.5 rounded-2xl border border-white/5 text-xs font-semibold">
                  {[
                    { id: "all", label: "Все" },
                    { id: "critical", label: "Критично" },
                    { id: "high", label: "Высокий риск" },
                    { id: "watch", label: "Следить" },
                    { id: "safe", label: "Запас" }
                  ].map(t => (
                    <button key={t.id} onClick={() => setFilter(t.id)} className={`px-3.5 py-1.5 rounded-xl transition ${filter === t.id ? "bg-orange-600 text-white shadow-md shadow-orange-600/30" : "text-slate-400 hover:text-white"}`}>
                      {t.label}
                    </button>
                  ))}
                </div>

                {/* Поиск и кнопки управления */}
                <div className="flex items-center gap-2 w-full md:w-auto">
                  <button 
                    onClick={() => fetchSheetData(true)} 
                    disabled={isSyncing}
                    title="Обновить данные"
                    className="flex items-center justify-center w-10 h-10 bg-slate-900/80 hover:bg-slate-800 text-slate-300 border border-white/10 rounded-xl transition disabled:opacity-50"
                  >
                    <svg className={`w-4 h-4 ${isSyncing ? 'animate-spin text-orange-400' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                  </button>

                  <button 
                    onClick={() => setSortOrder(prev => prev === "desc" ? "asc" : "desc")} 
                    title="Сортировать по остатку"
                    className="flex items-center gap-1.5 px-3 py-2.5 h-10 text-xs font-semibold bg-slate-900/80 hover:bg-slate-800 text-slate-300 border border-white/10 rounded-xl transition shrink-0"
                  >
                    <span>{sortOrder === "desc" ? "Сначала большой остаток" : "Сначала маленький остаток"}</span>
                  </button>

                  <div className="relative flex-1 md:flex-initial">
                    <input 
                      type="text" 
                      placeholder="Поиск по ФОП, ИНН, банку..." 
                      value={search} 
                      onChange={e => setSearch(e.target.value)} 
                      className="pl-4 pr-4 py-2 h-10 text-xs bg-slate-900/80 border border-white/10 rounded-xl outline-none focus:border-orange-500 transition w-full md:w-60 text-white placeholder-slate-500" 
                    />
                  </div>
                </div>
              </div>

              {/* СПИСОК ФОП */}
              {loading && !isSyncing ? (
                <div className="text-center py-20 text-slate-500 text-sm font-medium">Загружаем обновлённые данные... ⏳</div>
              ) : filtered.length === 0 ? (
                <div className="text-center py-20 text-slate-500 text-sm font-medium">Ничего не найдено 🔍</div>
              ) : (
                <div className="space-y-3">
                  {filtered.map((f, index) => (
                    <div key={f.id || index} className="glass-card glass-card-hover p-4.5 rounded-2xl border border-white/5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                      
                      {/* Данные ФОП */}
                      <div className="lg:w-80 shrink-0 space-y-1">
                        <div 
                          onClick={() => copyToClipboard(f.name, "Название ФОП")}
                          title="Скопировать ФОП"
                          className="font-extrabold text-sm text-white hover:text-orange-400 transition truncate cursor-pointer flex items-center gap-1.5 group/name"
                        >
                          <span className="truncate">{f.name}</span>
                          <svg className="w-3.5 h-3.5 opacity-0 group-hover/name:opacity-100 text-orange-400 transition shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                          </svg>
                        </div>

                        <div className="flex items-center gap-2 flex-wrap">
                          <button 
                            onClick={() => copyToClipboard(f.inn, `ИНН ${f.inn}`)}
                            title="Скопировать ИНН"
                            className="bg-slate-900/90 hover:bg-orange-500/20 hover:text-orange-300 border border-white/10 px-2 py-0.5 rounded-md text-[10px] font-mono font-semibold text-slate-400 transition flex items-center gap-1 cursor-pointer"
                          >
                            <span>ІПН {f.inn || "—"}</span>
                            {f.inn && (
                              <svg className="w-3 h-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                              </svg>
                            )}
                          </button>
                        </div>

                        {/* Чипсы банков */}
                        <div className="text-[11px] text-slate-400 pt-0.5 flex items-center gap-1.5 truncate">
                          <span className="text-slate-500">🏦</span>
                          <span className="truncate font-semibold text-slate-300">{f.banks}</span>
                        </div>
                      </div>
                      
                      {/* Шкала заполнения */}
                      <div className="flex-1 max-w-xl space-y-1.5">
                        <div className="flex justify-between items-center text-[11px]">
                          <span className="font-semibold text-slate-400">Остаток: <strong className="text-white">{new Intl.NumberFormat("ru-RU").format(f.remaining)} ₴</strong></span>
                          <span className="font-black text-orange-400">{f.pct}%</span>
                        </div>
                        <div className="relative w-full h-2.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                          <div className={`absolute left-0 top-0 bottom-0 ${f.bar} transition-all duration-500 rounded-full shadow-sm`} style={{ width: `${f.pct}%` }}></div>
                        </div>
                      </div>

                      {/* Расходы & Бейдж */}
                      <div className="flex items-center gap-4 justify-between lg:justify-end shrink-0">
                        <div className="text-right">
                          <div className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Расход за год</div>
                          <div className="text-xs font-black text-slate-200">{new Intl.NumberFormat("ru-RU").format(f.turnover)} ₴</div>
                        </div>
                        <span className={`text-xs font-bold px-3.5 py-1.5 rounded-xl border backdrop-blur-md ${f.badge}`}>{f.label}</span>
                      </div>

                    </div>
                  ))}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    document.getElementById("root") && ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
